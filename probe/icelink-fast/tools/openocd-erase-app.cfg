# Erase the 80K app slot ONLY, to force the bootloader back to MAINTENANCE.
#
# This is the SWD equivalent of the b/dead-man escape hatch: invalidate the
# app's vector table so the bootloader stops launching it and mounts its
# drive instead. Use when a partial or hung image is stopping enumeration --
# a half-written image still has a valid-looking vector table in its first
# page, so the bootloader launches it and it hangs before USB comes up, which
# also means the dead-man timer never runs.
#
# Erase, not reflash, on purpose: getting back to MAINTENANCE restores the
# grabber-free loop, and everything after that can go over USB again.
#
# The bootloader at 0x08000000 is NEVER touched -- it is the only way back that
# does not involve grabbers. The tripwire below refuses to run if it has moved.
#
# Requires host/ch347_nrst.py --high first; prefer ./host/swd.sh for retries.

adapter driver ch347
transport select swd
set CPUTAPID 0
source [find target/stm32f1x.cfg]
adapter speed 1000
reset_config none separate
gdb port disabled
tcl port disabled
telnet port disabled

init
catch { halt }

catch { write_memory 0xE0042004 32 {0x00000307} }
catch { halt }

set sp [read_memory 0x08000000 32 1]
set pc [read_memory 0x08000004 32 1]
echo [format "bootloader SP=0x%08x PC=0x%08x (expect 0x20002848 / 0x080001cd)" $sp $pc]
if {$sp != 0x20002848 || $pc != 0x080001cd} {
    echo "REFUSING: bootloader vector table does not match the dump."
    shutdown error
}

halt
# 0x0800C000 + 80K - 1. erase_address wants an address range, not page numbers.
flash erase_address unlock 0x0800C000 0x14000

echo "--- verify erased ---"
echo [format "app SP=0x%08x PC=0x%08x (both 0xffffffff = erased)" \
        [read_memory 0x0800C000 32 1] [read_memory 0x0800C004 32 1]]
echo "Now pulse NRST (host/ch347_nrst.py --low then --high) or replug USB."
echo "MAINTENANCE should mount; flash over USB from there."

shutdown
