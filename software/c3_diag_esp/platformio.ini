; ESP32-C3 link CONTINUITY DIAGNOSTIC -- C3 side.
;
; Companion to software/c3_diag (FPGA side). Throws away the SPI stack and drives
; the same five wires as raw GPIO so we can prove signal continuity + direction
; wire by wire before trusting the real SPI link. See docs/c3_loader.md.
;
;   pio run -d software/c3_diag_esp -t upload   # over /dev/ttyACM0
;   pio device monitor -p /dev/ttyACM0          # USB-CDC console
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1          ; C3 native USB
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial to USB-CDC
