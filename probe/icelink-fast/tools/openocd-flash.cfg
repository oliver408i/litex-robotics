# Flash the interface slot ONLY. ch347 + SWD.
#
# PREREQUISITE, verified on hardware 2026-09-01:
#   ../../.venv/bin/python host/ch347_nrst.py --high
# NRST hangs off the adapter's TRST pin (CH347 GPIO5). OpenOCD cannot drive it
# in SWD mode ("Asserting TRST not supported in SWD mode!"), and with the pin
# left alone SWD returns DPIDR 0xfe0c001b instead of 0x2ba01477.
#
# There is deliberately no mass_erase here. The 48K bootloader at 0x08000000 is
# the only way back that does not involve IC grabbers; `program` erases only the
# pages it writes.

adapter driver ch347
transport select swd
set CPUTAPID 0
source [find target/stm32f1x.cfg]
adapter speed 1000
reset_config none separate
gdb port disabled
tcl port disabled
telnet port disabled

init
catch { halt }

# DBGMCU_CR: freeze IWDG/WWDG and hold the connection through sleep/stop/standby.
# Without this the halted DAPLink stops feeding its watchdog, the core resets,
# and the link looks flaky when it is not. Verified 2026-09-01.
catch { write_memory 0xE0042004 32 {0x00000307} }
catch { halt }

# Tripwire: refuse to write if the bootloader is not exactly what we dumped.
set sp [read_memory 0x08000000 32 1]
set pc [read_memory 0x08000004 32 1]
echo [format "bootloader SP=0x%08x PC=0x%08x (expect 0x20002848 / 0x080001cd)" $sp $pc]
if {$sp != 0x20002848 || $pc != 0x080001cd} {
    echo "REFUSING: bootloader vector table does not match the dump."
    shutdown error
}

# `program` internally does a reset, which this adapter cannot do -- it failed
# with "Unable to reset target" and silently wrote nothing. Do the steps by
# hand instead, and reset externally by pulsing NRST via host/ch347_nrst.py.
halt
flash write_image erase unlock build/icelink-fast.bin 0x0800C000 bin
verify_image build/icelink-fast.bin 0x0800C000 bin
shutdown
