; ESP32-C3 UART listener -- C3 side of the beacon direction-isolation test.
;
; The FPGA (icepi_zero_c3uartbeacon.py) continuously transmits an incrementing
; byte on M2; this just listens on GPIO3 and prints what arrives, checking for a
; clean 00,01,02,... sequence. Proves the FPGA->C3 direction in isolation.
;   C3 RX = GPIO3 <- FPGA tx (M2)
;
;   pio run -d software/c3_uart_listen_esp -t upload   # over /dev/ttyACM0
;   pio device monitor -p /dev/ttyACM0
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
