; ESP32-C3 SPI flash-loader bridge -- the "brain" of the C3 loader.
;
; Talks to the host over native USB-CDC and to the FPGA (which is the SPI SLAVE)
; over the dedicated C3 bus. Mirrors the protocol in software/c3_loader/main.c.
; See docs/c3_loader.md for the architecture.
;
; Flash + monitor over the C3's native USB (the Espressif USB-JTAG/serial unit):
;   pio run -t upload          # uploads over /dev/ttyACM0
;   pio device monitor         # USB-CDC console (the bring-up self-test prints here)
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_port   = /dev/ttyACM1
monitor_port  = /dev/ttyACM1
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1          ; C3 native USB
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial to USB-CDC
