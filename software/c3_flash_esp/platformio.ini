; ESP32-C3 SPIBone flash loader -- C3 side ("brain").
;
; Drives the FPGA over SPIBone (Wishbone-over-SPI, HW SPI @8MHz) and the mailbox
; protocol implemented in software/c3_flash/main.c. Stage 1 = PING (read the flash
; JEDEC id through the mailbox); erase/program/verify + host image streaming next.
; See icepi_zero_c3flash.py / docs/c3_loader.md.
;
;   pio run -d software/c3_flash_esp -t upload   # over /dev/ttyACM0
;   pio device monitor -p /dev/ttyACM0
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
