; ESP32-C3 SPIBone Wishbone-over-SPI master -- C3 side.
;
; Talks to the FPGA's LiteX SPIBone bridge (gateware add_c3_spibone) as a Wishbone
; MASTER over hardware SPI. Replaces the old custom-SPISlave loader transport. See
; icepi_zero_c3spibone.py and docs/c3_loader.md.
;
;   pio run -d software/c3_spibone_esp -t upload   # over /dev/ttyACM0
;   pio device monitor -p /dev/ttyACM0             # USB-CDC console
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1          ; C3 native USB
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial to USB-CDC
