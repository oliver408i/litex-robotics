# ONE-SHOT: replace the DAPLink bootloader with the stm32duino USB DFU
# bootloader, and install our app at 0x08002000.
#
# After this, DAPLink drag-and-drop is gone for good and flashing is:
#   dfu-util -a 2 -d 1eaf:0003 -D build/icelink-fast.bin
#
# Prerequisite: host/ch347_nrst.py --high

adapter driver ch347
transport select swd
set CPUTAPID 0
source [find target/stm32f1x.cfg]
adapter speed 100
reset_config none separate
gdb port disabled
tcl port disabled
telnet port disabled

init
catch { halt }
catch { write_memory 0xE0042004 32 {0x00000307} }
catch { halt }

# App first, so that if the link dies between the two writes we are left with a
# working bootloader and no app (recoverable over USB) rather than the reverse.
flash write_image erase unlock build/icelink-fast.bin 0x08002000 bin
verify_image build/icelink-fast.bin 0x08002000 bin
echo "app installed at 0x08002000"

flash write_image erase unlock tools/stm32duino_boot20_pb0_8k.bin 0x08000000 bin
verify_image tools/stm32duino_boot20_pb0_8k.bin 0x08000000 bin
echo "DFU bootloader installed at 0x08000000"
shutdown
