; ESP32-C3 UART echo test -- C3 side.
;
; Transport sanity check for the C3<->FPGA link after both SPI paths failed. The
; FPGA (icepi_zero_c3uart.py) echoes bytes in pure gateware; this sends bytes on
; a hardware UART and checks they come back. Reuses the MOSI/MISO wires:
;   C3 TX = GPIO1 -> FPGA RX (L1)     C3 RX = GPIO3 <- FPGA TX (M2)
;
;   pio run -d software/c3_uart_esp -t upload   # over /dev/ttyACM0
;   pio device monitor -p /dev/ttyACM0          # USB-CDC console (results here)
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1          ; C3 native USB
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial (console) to USB-CDC
