; ESP32-C3 UARTBone Wishbone-over-UART master -- C3 side.
;
; Talks to the FPGA's LiteX UARTBone bridge (gateware add_c3_uartbone) as a
; Wishbone MASTER over a hardware UART -- the verified async replacement for the
; twice-failed SPI transport. See icepi_zero_c3uartbone.py.
;   C3 TX = GPIO1 -> FPGA rx (L1)     C3 RX = GPIO3 <- FPGA tx (M2)
;
;   pio run -d software/c3_uartbone_esp -t upload   # over /dev/ttyACM0
;   pio device monitor -p /dev/ttyACM0              # USB-CDC console (results)
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
