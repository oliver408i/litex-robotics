# Read back the 48K bootloader for diffing against the teardown dump.
# Requires host/ch347_nrst.py --high first (see openocd-flash.cfg).

adapter driver ch347
transport select swd
set CPUTAPID 0
source [find target/stm32f1x.cfg]
adapter speed 100
reset_config none separate
gdb port disabled
tcl port disabled
telnet port disabled

init
catch { halt }

# DBGMCU_CR: freeze IWDG/WWDG and hold the connection through sleep/stop/standby.
# Without this the halted DAPLink stops feeding its watchdog, the core resets,
# and the link looks flaky when it is not. Verified 2026-09-01.
catch { write_memory 0xE0042004 32 {0x00000307} }
catch { echo [format "DBGMCU_CR = 0x%08x" [read_memory 0xE0042004 32 1]] }
catch { halt }

dump_image /tmp/bl-readback.bin 0x08000000 49152
shutdown
