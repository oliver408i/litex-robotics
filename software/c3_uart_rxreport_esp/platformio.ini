; ESP32-C3 UART RX-report -- C3 side of the receive-side isolation test.
;
; The FPGA (icepi_zero_c3uartrx.py) reflects the last byte it received on L1 back
; out M2. This sends a known incrementing value on GPIO1 (TX) and checks what the
; FPGA reflects back on GPIO3 (RX) -- proving whether the FPGA receives on L1.
;   C3 TX = GPIO1 -> FPGA rx (L1)     C3 RX = GPIO3 <- FPGA tx (M2)
;
;   pio run -d software/c3_uart_rxreport_esp -t upload   # over /dev/ttyACM0
;   pio device monitor -p /dev/ttyACM0
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
