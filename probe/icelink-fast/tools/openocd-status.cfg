# Read-only triage. Writes NOTHING to flash -- run this first.
#
# Answers, in order, the questions that decide what to do next:
#   1. Is the bootloader still the one from the teardown dump?
#   2. What is in the app slot -- erased, a partial image, or intact?
#   3. Is readout protection on? (a failed flash write enabled it once before,
#      see "SWD link notes" in README.md)
#
# Requires host/ch347_nrst.py --high first; prefer ./host/swd.sh to get the
# retry-across-speeds behaviour this bench needs.

adapter driver ch347
transport select swd
set CPUTAPID 0
source [find target/stm32f1x.cfg]
adapter speed 100
reset_config none separate
gdb port disabled
tcl port disabled
telnet port disabled

init
catch { halt }

# Freeze the watchdogs, or DAPLink's unfed IWDG resets the core mid-session and
# the link looks flaky when it is not.
catch { write_memory 0xE0042004 32 {0x00000307} }
catch { halt }

echo "--- identity ---"
catch { echo [format "CPUID         = 0x%08x (expect 0x412fc231)" [read_memory 0xE000ED00 32 1]] }

echo "--- bootloader @0x08000000 ---"
set bsp [read_memory 0x08000000 32 1]
set bpc [read_memory 0x08000004 32 1]
echo [format "SP=0x%08x PC=0x%08x  (expect 0x20002848 / 0x080001cd)" $bsp $bpc]
if {$bsp == 0x20002848 && $bpc == 0x080001cd} {
    echo "bootloader: INTACT"
} else {
    echo "bootloader: MISMATCH -- do not flash, investigate first"
}

echo "--- app slot @0x0800C000 ---"
set asp [read_memory 0x0800C000 32 1]
set apc [read_memory 0x0800C004 32 1]
echo [format "SP=0x%08x PC=0x%08x" $asp $apc]
if {$asp == 0xffffffff && $apc == 0xffffffff} {
    echo "app: ERASED -- bootloader should be showing MAINTENANCE"
} elseif {$asp > 0x20000000 && $asp <= 0x20005000 && ($apc & 1)} {
    echo "app: vector table LOOKS VALID -- the bootloader will launch it."
    echo "     If it does not enumerate, this is a partial/hung image:"
    echo "     erase it (tools/openocd-erase-app.cfg) to get MAINTENANCE back."
} else {
    echo "app: vector table INVALID -- bootloader should fall back to MAINTENANCE"
}

echo "--- readout protection ---"
# 0x1FFFF800 option bytes; RDP unprotected reads 0x5AA5 in the low half.
catch { echo [format "option bytes  = 0x%08x (0xffff5aa5 = RDP level 0, unprotected)" \
        [read_memory 0x1FFFF800 32 1]] }
catch { echo [format "FLASH_OBR     = 0x%08x (bit1 RDPRT set = protected)" \
        [read_memory 0x4002201C 32 1]] }

shutdown
